# Cloudflare Pages configuration for the Yuniko frontend.
# Build command: pnpm run build
# Build output directory: artifacts/yuniko/dist/public
# Deployment is handled by Cloudflare Pages; do not run `wrangler deploy` from the workspace root.
name = "yunikofinal"
pages_build_output_dir = "artifacts/yuniko/dist/public"
compatibility_date = "2026-09-04"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
CORS_ORIGINS = "https://yunikofinal.pages.dev"
SUPABASE_URL = "https://pqjrmtkfgwoocbvmwbby.supabase.co"
SUPABASE_MEDIA_BUCKET = "media"
VIDEO_ENABLED = "false"
LIVE_ENABLED = "false"
SFU_ENABLED = "false"
LIVE_RECORDING_ENABLED = "false"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "bf18a09e49314ceb9f76879895e7e67d"
