name: Prepare Yusheng + Yuniko fusion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Yunikofinal
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Recover sources
        run: |
          set -euo pipefail
          rm -rf /tmp/yuniko /tmp/yusheng
          git clone --depth 1 https://github.com/Aora-group-entreprise/Yuniko.git /tmp/yuniko
          mkdir -p /tmp/yusheng
          unzip -q 'yusheng-main (1).zip' -d /tmp/yusheng

      - name: Make Yusheng the application base
        run: |
          set -euo pipefail
          YUSHENG_ROOT="/tmp/yusheng/yusheng-main"
          rsync -a --delete --exclude='.git' --exclude='.env' --exclude='yusheng-main (1).zip' "$YUSHENG_ROOT/" ./

      - name: Fuse Yuniko features into the Yusheng project
        run: |
          set -euo pipefail
          rm -rf yuniko-source
          mkdir -p yuniko-source
          rsync -a --exclude='.git' --exclude='.env' /tmp/yuniko/ yuniko-source/
          mkdir -p artifacts/api-server artifacts/yuniko lib
          rsync -a --delete yuniko-source/artifacts/api-server/ artifacts/api-server/
          rsync -a --delete yuniko-source/artifacts/yuniko/ artifacts/yuniko/
          if [ -d yuniko-source/lib ]; then rsync -a --delete yuniko-source/lib/ lib/; fi

          rm -rf src/yusheng src/yuniko
          cp -a /tmp/yusheng/yusheng-main/src src/yusheng
          cp -a yuniko-source/artifacts/yuniko/src src/yuniko
          find src/yusheng -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o -name '*.css' \) -print0 | xargs -0 sed -i 's|@/|@yusheng/|g'

          cat > src/App.tsx <<'EOF'
          import YunikoApp from "@/App";
          export default YunikoApp;
          EOF

          # Use Yusheng's Tailwind 3 stylesheet as the root stylesheet.
          # Yuniko's Tailwind 4 stylesheet stays isolated in src/yuniko.
          cp /tmp/yusheng/yusheng-main/src/index.css src/index.css

          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          s = p.read_text()
          s = s.replace('"@": path.resolve(__dirname, "./src")', '"@": path.resolve(__dirname, "./src/yuniko"), "@yusheng": path.resolve(__dirname, "./src/yusheng")')
          p.write_text(s)
          PY

          cat > YUNIKO_FUSION_MANIFEST.md <<'EOF'
          # Yunikofinal — Yusheng base + Yuniko functional fusion

          Yusheng is the stable base source tree in `src/yusheng` and supplies the root UI stylesheet.
          Yuniko is the active functional application layer in `src/yuniko`.
          Yuniko API/infrastructure is preserved under `artifacts/api-server` and shared packages under `lib`.

          Preserved systems include Feed, Posts, Stories, Live, Likes, Comments, Shares, Friends/Follows,
          Notifications, Private Chat, Audio/Video Calls, Profiles, Settings, language support, security,
          PostgreSQL/Drizzle, Supabase Storage, Cloudflare and monetization infrastructure.

          `.env` and credentials are never copied into the repository.
          EOF

      - name: Validate the fused frontend
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund wouter react-icons
          npm run build

      - name: Commit fusion state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: wire Yuniko runtime into Yusheng base'
          git push origin HEAD:main
